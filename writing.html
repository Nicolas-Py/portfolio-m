<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NVM - Writing</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <p><span class="dash">&lt;-</span><a href="/portfolio-m/" class="hex">dac5d8de</a> [<span class="page-name">GO
      BACK</span>]</p>
  <div id="writing-container"></div>
  <script>
    const PORTFOLIO_API_URL = 'https://nicolas-py.github.io/portfolio-provider/api/portfolio.json';

    // Generate 8-char hex from last 4 chars of URL (strips trailing slash)
    const toHex = (url) => url.replace(/\/$/, '').slice(-4).split('').map(c => c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0')).join('').padEnd(8, '0');

    fetch(PORTFOLIO_API_URL)
      .then(response => {
        if (!response.ok) throw new Error(`Failed to fetch: ${response.status}`);
        return response.json();
      })
      .then(data => {
        const container = document.getElementById('writing-container');
        data.writing.forEach(article => {
          const hex = toHex(article.link.url);
          const articleSection = document.createElement('section');
          articleSection.innerHTML = `
            <p>${article.title} <span class="page-name">[${article.date}]</span></p>
            <p>${article.description}</p>
            <p><span class="dash">-</span><a href="${article.link.url}" class="hex">${hex}</a> [<span class="page-name">${article.link.label}</span>]</p>
            <p>----------------------------------------</p>
        `;
          container.appendChild(articleSection);
        });
      })
      .catch(error => console.error('Error loading data:', error));
  </script>
</body>

</html>
