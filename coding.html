<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NVM - Coding</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<p><span class="dash"><-</span><a href="/portfolio-m/" class="hex">dac5d8de</a> [<span class="page-name">GO BACK</span>]</p>
<div id="projects-container"></div>
<script>
  fetch('projects.json')
    .then(response => response.json())
    .then(projects => {
      const container = document.getElementById('projects-container');
      projects.forEach(project => {
        const projectSection = document.createElement('section');
        projectSection.innerHTML = `
            <p>${project.title} <span class="page-name ${project.status === 'Completed' ? 'green' : 'orange'}">[${project.status}]</span></h2>
            <p>${project.description}</p>
            <p><span class="dash">-</span><a target="_blank" rel="noopener noreferrer" href=${project.link.url} class="hex">${project.link.hex}</a> [<span class="page-name">${project.link.label}</span>]</p>
            <p>${"----------------------------------------"}</p>
        `;
        container.appendChild(projectSection);
      });
    })
    .catch(error => console.error('Error loading projects:', error));
</script>
</body>
</html>
